# CI of OAR's own public repo, github.com/Teodagher/oar (inert inside agent8, whose tests.yml runs the
# same checks in its `spec` job). This folder is published there as the
# repository root (git subtree split --prefix=spec/agent-format).
name: check
on:
  push:
  pull_request:
jobs:
  oar:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 (the oldest the tool supports) is no longer built for
          # the newest Ubuntu runner, so it runs on 24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml jsonschema
      - run: python3 -m unittest discover -s tools
      - name: oar check on the example templates
        run: |
          for t in teo-memory-agent invoice-chaser; do
            python3 tools/oar.py check --all-files "examples/$t"
          done
          python3 tools/oar.py check examples/installed-copy
